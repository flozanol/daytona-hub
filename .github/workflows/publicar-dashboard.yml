name: Publicar dashboard de marketing

on:
  push:
    branches: ["main"]
    paths:
      - "marketing-dashboard/docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos del dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: "marketing-dashboard/docs"
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
